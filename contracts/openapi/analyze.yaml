openapi: 3.1.0
info:
  title: 引导助手 Analyze 接口
  version: 0.1.0
  description: Android 客户端请求多轮引导分析的 MVP 外部合同。

paths:
  /analyze:
    post:
      summary: 提交一次引导事件并返回当前步骤结果。
      operationId: analyzeScreen
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
                - screenshot
              properties:
                metadata:
                  type: string
                  description: 符合 AnalyzeMetadata 结构的 JSON 字符串。
                  contentMediaType: application/json
                  contentSchema:
                    $ref: "#/components/schemas/AnalyzeMetadata"
                screenshot:
                  type: string
                  format: binary
                  description: 当前页面截图文件，推荐使用 JPEG。
      responses:
        "200":
          description: 成功处理本次事件并返回当前引导结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeSuccessResponse"
        "400":
          description: 请求不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidRequest:
                  value:
                    code: INVALID_REQUEST
                    message: 请求字段缺失或不合法。
        "502":
          description: 分析失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                analysisFailed:
                  value:
                    code: ANALYSIS_FAILED
                    message: 未能获得有效的分析结果。
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  value:
                    code: INTERNAL_ERROR
                    message: 发生未预期的内部错误。
components:
  schemas:
    AnalyzeMetadata:
      type: object
      required:
        - deviceId
        - messageType
        - messageText
        - packageName
        - screenWidth
        - screenHeight
        - imageWidth
        - imageHeight
        - nodes
      properties:
        deviceId:
          type: string
          description: Android 设备或安装实例标识。
        conversationId:
          type: string
          format: uuid
          description: |
            当前续跑要归属的会话 ID。
            - `speech_text` 首轮可不传
            - `observed_click` / `observed_scroll` 续跑时建议传
        messageType:
          type: string
          enum:
            - speech_text
            - observed_click
            - observed_scroll
          description: 本次事件类型。
        messageText:
          oneOf:
            - type: string
            - type: "null"
          description: |
            本次事件的文本内容。
            - `speech_text` 时应传语音转写文本
            - `observed_click` / `observed_scroll` 时固定传 null
        packageName:
          type: string
          description: 当前页面所属 Android 包名。
        activityName:
          type: string
          description: 当前页面的 Activity 或窗口名称，可用时提供。
        screenWidth:
          type: integer
          minimum: 1
          description: 当前屏幕宽度，单位为像素，用于定义屏幕坐标空间。
        screenHeight:
          type: integer
          minimum: 1
          description: 当前屏幕高度，单位为像素，用于定义屏幕坐标空间。
        imageWidth:
          type: integer
          minimum: 1
          description: 上传截图的图像宽度，单位为像素，用于定义图像坐标空间。
        imageHeight:
          type: integer
          minimum: 1
          description: 上传截图的图像高度，单位为像素，用于定义图像坐标空间。
        nodes:
          type: array
          description: 标准化后的关键无障碍节点数组，按阅读顺序排序，先按 top 从小到大，再按 left 从小到大。
          items:
            $ref: "#/components/schemas/Node"
    Node:
      type: object
      required:
        - text
        - contentDescription
        - className
        - clickable
        - editable
        - enabled
        - bounds
      properties:
        text:
          type: string
          description: 节点可见文本；如果没有可用文本，返回空字符串。
        contentDescription:
          type: string
          description: 节点的无障碍描述文本；如果没有可用描述，返回空字符串。
        className:
          type: string
          description: Android 类名或控件类型；如果没有可用值，返回空字符串。
        clickable:
          type: boolean
          description: 节点是否可点击。
        editable:
          type: boolean
          description: 节点是否可编辑，例如输入框。
        enabled:
          type: boolean
          description: 节点当前是否可用。
        bounds:
          $ref: "#/components/schemas/Bounds"
    Bounds:
      type: object
      required:
        - left
        - top
        - right
        - bottom
      properties:
        left:
          type: integer
        top:
          type: integer
        right:
          type: integer
        bottom:
          type: integer
      description: 屏幕坐标空间中的矩形区域，单位为像素。
    AnalyzeSuccessResponse:
      type: object
      required:
        - conversationId
        - runId
        - conversationStatus
        - answer
        - target
        - action
      properties:
        conversationId:
          type: string
          format: uuid
          description: 当前步骤归属的会话 ID。
        runId:
          type: string
          format: uuid
          description: 当前这一次短运行的 ID。
        conversationStatus:
          type: string
          enum:
            - waiting_interaction
            - completed
            - failed
          description: 当前会话在本次返回后的状态。
        answer:
          type: string
          description: 用于展示和播报给用户的主回答。
        target:
          oneOf:
            - $ref: "#/components/schemas/Target"
            - type: "null"
          description: 建议动作对应的目标区域；如果无法可靠定位，必须返回 null。
        action:
          $ref: "#/components/schemas/Action"
        savedMetadataPath:
          type: string
          description: server 侧调试用途，metadata.json 在本地临时目录中的保存路径。
        savedScreenshotPath:
          type: string
          description: server 侧调试用途，screenshot.jpg 在本地临时目录中的保存路径。
      description: |
        MVP 动作约束：
        - 当 action.type 为 tap 时，target 必须非空
        - 当 action.type 为 scroll 时，target 可以为空
        - 当 action.type 为 none 时，target 必须为 null
    Target:
      type: object
      required:
        - label
        - bounds
      properties:
        label:
          type: string
          description: 面向用户可理解的目标描述，例如“发送按钮”。
        bounds:
          $ref: "#/components/schemas/Bounds"
      description: target.bounds 必须使用屏幕坐标空间返回。
    Action:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - tap
            - scroll
            - none
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - ANALYSIS_FAILED
            - INTERNAL_ERROR
        message:
          type: string
